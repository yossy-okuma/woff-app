<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社内ナレッジ検索</title>
  <script src="https://static.worksmobile.net/static/wf/woff/edge/2.0/sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f4f8;
      --surface: #ffffff;
      --surface2: #e8f0fe;
      --border: #dce3ed;
      --border-active: #3b82f6;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --accent2: #0ea5e9;
      --text: #1e293b;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --success: #0ea5e9;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 1px 4px rgba(37,99,235,0.07), 0 4px 16px rgba(37,99,235,0.06);
      --shadow-md: 0 2px 8px rgba(37,99,235,0.10), 0 8px 32px rgba(37,99,235,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0 0 40px;
      max-width: 600px;
      margin: 0 auto;
      position: relative;
    }

    /* トップバー */
    .topbar {
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 60%, #0ea5e9 100%);
      padding: 20px 20px 28px;
      position: relative;
      overflow: hidden;
    }
    .topbar::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
      pointer-events: none;
    }
    .topbar::after {
      content: '';
      position: absolute;
      bottom: -60px; left: 20px;
      width: 140px; height: 140px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      pointer-events: none;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
    }
    .header-icon {
      width: 44px; height: 44px;
      border-radius: 14px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
      backdrop-filter: blur(4px);
    }
    .header-text h1 {
      font-size: 18px; font-weight: 700;
      color: #ffffff; letter-spacing: -0.01em;
    }
    .header-text p {
      font-size: 11px; color: rgba(255,255,255,0.65);
      margin-top: 2px; letter-spacing: 0.04em; text-transform: uppercase;
    }

    /* ユーザーバッジ */
    .user-badge {
      display: none;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 99px;
      padding: 5px 12px 5px 5px;
      margin-top: 14px;
      width: fit-content;
      position: relative;
      z-index: 1;
    }
    .user-badge.show { display: flex; }
    .user-avatar {
      width: 26px; height: 26px; border-radius: 50%;
      background: rgba(255,255,255,0.9);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: var(--accent);
    }
    .user-name { font-size: 12px; color: rgba(255,255,255,0.9); }

    /* メインコンテンツ */
    .main {
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* カード */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      margin-bottom: 14px;
    }

    .section-label {
      font-size: 11px; font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.08em; text-transform: uppercase;
      margin-bottom: 12px;
      display: flex; align-items: center; gap: 6px;
    }
    .section-label::before {
      content: '';
      width: 3px; height: 14px;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      border-radius: 99px;
      display: inline-block;
    }

    /* 部署選択 */
    .dept-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px;
    }
    .dept-btn {
      background: var(--accent-light);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 8px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 13px; font-weight: 500;
      text-align: center; cursor: pointer;
      transition: all 0.15s;
      position: relative; overflow: hidden;
    }
    .dept-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--surface2);
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(37,99,235,0.12);
    }
    .dept-btn.selected {
      border-color: var(--accent);
      color: var(--surface);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 2px 12px rgba(37,99,235,0.25);
      transform: translateY(-1px);
    }
    .dept-btn.selected::after {
      content: '✓';
      position: absolute; top: 4px; right: 6px;
      font-size: 9px; color: rgba(255,255,255,0.8);
    }

    /* 区切り */
    .divider {
      display: flex; align-items: center; gap: 10px;
      margin: 4px 0 14px;
    }
    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-text {
      font-size: 10px; color: var(--text-dim);
      letter-spacing: 0.08em; white-space: nowrap;
    }

    /* クイック質問 */
    .quick-list { display: flex; flex-direction: column; gap: 7px; }
    .quick-btn {
      background: var(--accent-light);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      color: var(--text-muted);
      font-family: inherit; font-size: 13px; font-weight: 400;
      text-align: left; cursor: pointer;
      transition: all 0.15s;
      display: flex; align-items: center; gap: 10px;
    }
    .quick-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--surface2);
      transform: translateX(3px);
    }
    .quick-btn::before {
      content: '→';
      font-size: 12px; color: var(--accent);
      flex-shrink: 0;
    }

    /* 入力 */
    .input-wrapper {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
    }
    .input-wrapper:focus-within {
      border-color: var(--border-active);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1), var(--shadow);
    }
    .input-label {
      font-size: 11px; font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.08em; text-transform: uppercase;
      margin-bottom: 10px; display: block;
    }
    textarea {
      width: 100%; background: transparent;
      border: none; outline: none; resize: none;
      color: var(--text); font-family: inherit;
      font-size: 15px; font-weight: 400; line-height: 1.65;
      min-height: 90px; caret-color: var(--accent);
    }
    textarea::placeholder { color: var(--text-dim); }

    /* 部署未選択の警告 */
    .dept-warning {
      display: none;
      background: #fff7ed;
      border: 1.5px solid #fed7aa;
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      margin-bottom: 10px;
      font-size: 12px; font-weight: 500;
      color: #c2410c; text-align: center;
    }
    .dept-warning.show { display: block; }

    /* 送信ボタン */
    .send-btn {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, #1d4ed8, #2563eb, #0ea5e9);
      border: none;
      border-radius: var(--radius-sm);
      color: #ffffff;
      font-family: inherit; font-size: 14px; font-weight: 700;
      letter-spacing: 0.04em; cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-bottom: 14px;
      box-shadow: 0 2px 12px rgba(37,99,235,0.3);
    }
    .send-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(37,99,235,0.4);
    }
    .send-btn:active:not(:disabled) { transform: scale(0.99); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
    .send-btn svg { width: 16px; height: 16px; transition: transform 0.2s; }
    .send-btn:not(:disabled):hover svg { transform: translateX(3px); }

    /* ローディング */
    .loading-bar {
      display: none; height: 3px;
      background: var(--border);
      border-radius: 99px; margin-bottom: 14px; overflow: hidden;
    }
    .loading-bar.show { display: block; }
    .loading-bar::after {
      content: ''; display: block; height: 100%; width: 40%;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
      animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes slide { 0%{transform:translateX(-200%)} 100%{transform:translateX(450%)} }

    /* 回答 */
    .result-wrap { display: none; animation: fadeUp 0.3s ease; }
    .result-wrap.show { display: block; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    .result-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
    }
    .result-label {
      font-size: 11px; font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.08em; text-transform: uppercase;
      display: flex; align-items: center; gap: 6px;
    }
    .result-label::before {
      content: ''; width: 3px; height: 14px;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      border-radius: 99px; display: inline-block;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .result-dept {
      font-size: 11px; font-weight: 500;
      color: var(--surface);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 99px;
      padding: 2px 10px;
    }
    .result-box {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 18px 16px;
      font-size: 14px; font-weight: 400; line-height: 1.8;
      color: var(--text);
      white-space: pre-wrap; word-break: break-word;
      box-shadow: var(--shadow);
    }

    /* フッター */
    .footer {
      text-align: center;
      font-size: 10px; color: var(--text-dim);
      letter-spacing: 0.05em;
      padding: 8px 0 0;
    }
  </style>
</head>
<body>
  <!-- トップバー -->
  <div class="topbar">
    <div class="header">
      <div class="header-icon">🔍</div>
      <div class="header-text">
        <h1>社内ナレッジ検索</h1>
        <p>Powered by Ollama + OpenWebUI</p>
      </div>
    </div>
    <div class="user-badge" id="user-badge">
      <div class="user-avatar" id="user-avatar">？</div>
      <span class="user-name" id="user-name">読み込み中...</span>
    </div>
  </div>

  <div class="main">

    <!-- 部署選択 -->
    <div class="card">
      <div class="section-label">部署を選択</div>
      <div class="dept-grid" id="dept-grid"></div>
    </div>

    <!-- クイック質問 -->
    <div class="card">
      <div class="section-label">よくある質問</div>
      <div class="quick-list">
        <button class="quick-btn" onclick="setQuestion('就業規則について教えてください')">就業規則について教えてください</button>
        <button class="quick-btn" onclick="setQuestion('有給休暇の申請方法を教えてください')">有給休暇の申請方法を教えてください</button>
        <button class="quick-btn" onclick="setQuestion('経費精算の手順を教えてください')">経費精算の手順を教えてください</button>
      </div>
    </div>

    <!-- 入力 -->
    <div class="input-wrapper">
      <span class="input-label">質問内容</span>
      <textarea id="question" placeholder="何でも聞いてください..."></textarea>
    </div>

    <div class="dept-warning" id="dept-warning">⚠️ 部署を選択してください</div>

    <button class="send-btn" id="send-btn" onclick="askQuestion()">
      <span>回答を生成</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>

    <div class="loading-bar" id="loading"></div>

    <!-- 回答 -->
    <div class="result-wrap" id="result-wrap">
      <div class="result-header">
        <div class="result-label">回答</div>
        <div class="result-dept" id="result-dept"></div>
      </div>
      <div class="result-box" id="result"></div>
    </div>

    <div class="footer">大熊建設 社内システム</div>
  </div>

  <script>
    // ========== 設定（ここを変更してください） ==========
    const WOFF_ID     = "ここにWOFF IDを入れる";
    const N8N_WEBHOOK = "ここにn8nのWebhook URLを入れる";

    // 部署リスト：増やすときはここに1行追加するだけ
    // lwChannelId = LINE WORKSの実際のトークルームID
    const DEPARTMENTS = [
      { label: "A部署", channelId: "dept-a", lwChannelId: "A部署のLINE WORKSチャンネルID" },
      { label: "B部署", channelId: "dept-b", lwChannelId: "B部署のLINE WORKSチャンネルID" },
      { label: "C部署", channelId: "dept-c", lwChannelId: "C部署のLINE WORKSチャンネルID" },
      { label: "D部署", channelId: "dept-d", lwChannelId: "D部署のLINE WORKSチャンネルID" },
      // { label: "E部署", channelId: "dept-e", lwChannelId: "E部署のLINE WORKSチャンネルID" }, ← 追加するだけ
    ];
    // ===================================================

    let selectedDept = null;

    // 部署ボタンを動的に生成
    const grid = document.getElementById('dept-grid');
    DEPARTMENTS.forEach(dept => {
      const btn = document.createElement('button');
      btn.className = 'dept-btn';
      btn.textContent = dept.label;
      btn.onclick = () => selectDept(dept, btn);
      grid.appendChild(btn);
    });

    function selectDept(dept, btn) {
      document.querySelectorAll('.dept-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedDept = dept;
      document.getElementById('dept-warning').classList.remove('show');
    }

    // WOFF初期化
    woff.init({ woffId: WOFF_ID }).then(async () => {
      try {
        const profile = await woff.getProfile();
        const initial = profile.displayName ? profile.displayName[0] : '?';
        document.getElementById('user-avatar').textContent = initial;
        document.getElementById('user-name').textContent   = profile.displayName;
        document.getElementById('user-badge').classList.add('show');
      } catch(e) {}
    }).catch(() => {});

    function setQuestion(text) {
      document.getElementById('question').value = text;
      document.getElementById('question').focus();
    }

    async function askQuestion() {
      const q = document.getElementById('question').value.trim();
      if (!q) return;

      if (!selectedDept) {
        document.getElementById('dept-warning').classList.add('show');
        return;
      }

      const btn     = document.getElementById('send-btn');
      const loading = document.getElementById('loading');
      const wrap    = document.getElementById('result-wrap');
      const result  = document.getElementById('result');

      btn.disabled = true;
      loading.classList.add('show');
      wrap.classList.remove('show');

      try {
        const res = await fetch(N8N_WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: q,
            source: {
              channelId: selectedDept.channelId,
              lwChannelId: selectedDept.lwChannelId,
              userId: "woff-user"
            },
            content: {
              text: "@bobobot " + q
            }
          })
        });
        if (!res.ok) throw new Error('サーバーエラー: ' + res.status);
        const data = await res.text();
        result.textContent = data;
        document.getElementById('result-dept').textContent = selectedDept.label;
        wrap.classList.add('show');
      } catch(e) {
        result.textContent = '⚠️ エラーが発生しました\n' + e.message;
        wrap.classList.add('show');
      } finally {
        btn.disabled = false;
        loading.classList.remove('show');
      }
    }

    document.getElementById('question').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        askQuestion();
      }
    });
  </script>
</body>
</html>
